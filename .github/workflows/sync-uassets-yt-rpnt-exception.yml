name: Sync uAssets YT rpnt exception

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: # manual run button

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate yt-rpnt exception
        run: python scripts/sync_yt_rpnt_exception.py

      - name: Open PR if changed
        run: |
          gh pr create \
            --title "Sync brave-unbreak.txt with uAssets quick-fixes" \
            --body "Automated update after a change to the matching \`rpnt\` rule in uAssets \`filters/quick-fixes.txt\`." \
            --base master \
            --head auto/sync-uassets-quickfix || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}